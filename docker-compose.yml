services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      SQLITE_NAME: /app/data/db.sqlite3
      CACHE_BACKEND: django.core.cache.backends.filebased.FileBasedCache
      CACHE_LOCATION: /app/.django_cache
      CACHE_TIMEOUT: "300"
      CONN_MAX_AGE: "60"
      WEB_CONCURRENCY: "4"
      GUNICORN_THREADS: "4"
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles

volumes:
  sqlite_data:
  media_data:
  static_data:
