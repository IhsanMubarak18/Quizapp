{% extends "base.html" %}
{% block title %}Admin Login — Quiz Portal{% endblock %}
{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    }

    .auth-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
    }

    .auth-card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        padding: 44px 40px;
        width: 100%;
        max-width: 420px;
    }
</style>
{% endblock %}
{% block body %}
<div class="auth-wrap">
    <div class="auth-card">
        <div style="font-size:40px;margin-bottom:16px;text-align:center;">🔐</div>
        <h2 style="font-size:24px;font-weight:800;color:#1e1b4b;margin-bottom:4px;text-align:center;">Admin Login</h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:28px;text-align:center;">Enter your admin credentials</p>
        {% if error %}
        <div class="alert alert-error" style="margin-bottom:16px;">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width:100%;padding:13px;font-size:15px;border-radius:10px;margin-top:4px;">
                Login to Admin Panel
            </button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;">
            <a href="{% url 'video_app:home' %}" style="color:#64748b;">← Back to Home</a>
        </p>
    </div>
</div>
{% endblock %}
