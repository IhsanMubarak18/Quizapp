{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>{{ video.title }} - Video Quiz</title>
  <style>
  body {
    font-family: sans-serif;
    padding: 2em;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 900px;
    width: 100%;
    padding: 1em;
    text-align: center;
  }

  video {
    width: 100%;
    max-width: 100%;
    height: auto;
  }

  #quiz-box {
    display: none;
    background: #fff;
    padding: 1em;
    border: 2px solid #ccc;
    margin-top: 1em;
    border-radius: 8px;
    text-align: left;
  }

  .quiz-btn {
    margin-top: 1em;
    padding: 0.5em 1em;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: #007BFF;
    color: #fff;
    width: 100%;
    max-width: 300px;
  }

  .quiz-btn:hover {
    background-color: #0056b3;
  }

  .feedback {
    margin-top: 0.5em;
    font-weight: bold;
  }

  .cert-btn, .next-btn {
    margin-top: 2em;
    display: inline-block;
    padding: 0.6em 1em;
    background-color: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 5px;
  }

  .next-btn {
    background-color: #007bff;
  }

  h4 {
    margin-bottom: 0.5em;
  }

  @media (max-width: 600px) {
    body {
      padding: 1em;
    }

    .container {
      padding: 1em 0.5em;
    }

    .quiz-btn, .cert-btn, .next-btn {
      width: 100%;
      box-sizing: border-box;
    }
  }
</style>

</head>
<body>

<div class="container">
  <h2>{{ video.title }}</h2>

  <video id="video-player" width="720" controls style="margin-bottom: 1em;">
    {% if video.video_file %}
      <source src="{{ video.video_file.url }}" type="video/mp4" />
    {% else %}
      <p style="color:red;">⚠️ No video uploaded for this lesson.</p>
    {% endif %}
  </video>

  <p id="no-quiz-msg" style="display:none; color:gray;">No quiz questions available for this video.</p>

  <div id="quiz-box">
    <h3>Answer the following questions:</h3>
    <form id="quiz-form"></form>
    <p id="quiz-feedback" class="feedback"></p>
  </div>

  <div id="action-buttons"></div>
</div>

<script>
const video = document.getElementById('video-player');
const quizBox = document.getElementById('quiz-box');
const quizForm = document.getElementById('quiz-form');
const feedback = document.getElementById('quiz-feedback');
const noQuizMsg = document.getElementById('no-quiz-msg');
const actionButtons = document.getElementById('action-buttons');

let questions = [];
let selectedAnswers = [];

const videoId = parseInt("{{ video.id|default:'0' }}");

// Only load quiz questions when video ends
video.addEventListener('ended', () => {
  fetch(`/api/questions/${videoId}/`)
    .then(response => response.json())
    .then(data => {
      questions = data;
      if (questions.length === 0) {
        noQuizMsg.style.display = 'block';
        return;
      }
      showAllQuestions();
    })
    .catch(err => {
      noQuizMsg.textContent = "⚠️ Failed to load quiz questions.";
      noQuizMsg.style.display = 'block';
    });
});

function showAllQuestions() {
  quizBox.style.display = 'block';
  quizForm.innerHTML = '';
  feedback.textContent = '';

  questions.forEach((question, index) => {
    const questionBlock = document.createElement('div');
    questionBlock.style.marginBottom = '1em';

    const qTitle = document.createElement('h4');
    qTitle.textContent = `${index + 1}. ${question.text}`;
    questionBlock.appendChild(qTitle);

    question.options.forEach(option => {
      const label = document.createElement('label');
      label.innerHTML = `
        <input type="radio" name="q_${question.id}" value="${option.id}" required> ${option.text}
      `;
      questionBlock.appendChild(label);
      questionBlock.appendChild(document.createElement('br'));
    });

    quizForm.appendChild(questionBlock);
  });

  const submitBtn = document.createElement('button');
  submitBtn.type = 'submit';
  submitBtn.className = 'quiz-btn';
  submitBtn.textContent = 'Submit All Answers';
  quizForm.appendChild(submitBtn);

  quizForm.onsubmit = function (e) {
    e.preventDefault();
    feedback.textContent = "";
    selectedAnswers = [];

    let incomplete = false;
    questions.forEach(q => {
      const selectedInput = document.querySelector(`input[name="q_${q.id}"]:checked`);
      if (!selectedInput) {
        incomplete = true;
      } else {
        selectedAnswers.push({
          question_id: q.id,
          selected_option_id: parseInt(selectedInput.value)
        });
      }
    });

    if (incomplete) {
      feedback.textContent = "⚠️ Please answer all questions.";
      return;
    }

    submitFinalScore();
  };
}

function submitFinalScore() {
  fetch("{% url 'video_app:submit_quiz_result' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({
      video_id: videoId,
      answers: selectedAnswers
    })
  })
  .then(response => response.json())
  .then(data => {
    const container = document.createElement("div");
    actionButtons.innerHTML = "";

    {% if is_last_video %}
      const finishBtn = document.createElement("a");
      finishBtn.href = "{% url 'video_app:video_list' %}";
      finishBtn.className = "next-btn";
      finishBtn.textContent = "✅ Finish";
      container.appendChild(finishBtn);
    {% else %}
      const nextBtn = document.createElement("a");
      nextBtn.href = "{% url 'video_app:video_list' %}";
      nextBtn.className = "next-btn";
      nextBtn.textContent = "➡️ Next Video";
      container.appendChild(nextBtn);
    {% endif %}

    actionButtons.appendChild(container);
    feedback.textContent = "✅ Quiz submitted successfully!";
  })
  .catch(() => {
    feedback.textContent = "❌ Failed to submit quiz.";
  });
}
</script>

</body>
</html>
