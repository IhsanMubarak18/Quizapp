{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ video.title }} | EduVideoQuiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --primary: #6366f1;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Topbar */
    .topbar {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar a {
      color: #818cf8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar a:hover {
      color: #f1f5f9;
    }

    .topbar h1 {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Layout */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* Video */
    .video-wrap {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      display: block;
      max-height: 520px;
      background: #000;
    }

    /* Quiz box */
    #quiz-box {
      display: none;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(10px);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #quiz-box h3 {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .question-block {
      margin-bottom: 24px;
    }

    .question-block .q-text {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .option-label:hover {
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(99, 102, 241, 0.06);
    }

    .option-label input[type=radio] {
      accent-color: #6366f1;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .option-label input[type=radio]:checked+span {
      color: #818cf8;
    }

    .option-label:has(input:checked) {
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(99, 102, 241, 0.08);
    }

    #quiz-feedback {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
    }

    .feedback-warn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      display: block !important;
    }

    .feedback-ok {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      display: block !important;
    }

    .submit-btn {
      margin-top: 20px;
      padding: 13px 28px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      margin-right: 10px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }

    .action-btn.green {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }

    .action-btn.blue {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    #no-quiz-msg {
      display: none;
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    .video-hint {
      text-align: center;
      padding: 18px;
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    @media(max-width:640px) {
      .page {
        padding: 16px 14px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <a href="{% url 'video_app:video_list' %}">← Back to Videos</a>
    <h1>🎓 EduVideoQuiz</h1>
    <span style="color:#94a3b8;font-size:0.8rem;">{{ video.title }}</span>
  </div>

  <div class="page">
    <div class="video-wrap">
      {% if video.video_file %}
      <video id="video-player" controls>
        <source src="{{ video.video_file.url }}" type="video/mp4" />
        Your browser does not support video.
      </video>
      {% else %}
      <div style="padding:60px;text-align:center;color:#f87171;">⚠️ No video uploaded for this lesson.</div>
      {% endif %}
    </div>

    <div class="video-hint" id="watch-hint">
      📌 Watch the video fully to unlock the quiz below.
    </div>

    <div id="no-quiz-msg">❓ No quiz questions available for this video.</div>

    <div id="quiz-box">
      <h3>📝 Quiz Time!</h3>
      <form id="quiz-form"></form>
      <p id="quiz-feedback"></p>
    </div>

    <div id="action-buttons"></div>
  </div>

  <script>
    const videoEl = document.getElementById('video-player');
    const quizBox = document.getElementById('quiz-box');
    const quizForm = document.getElementById('quiz-form');
    const feedback = document.getElementById('quiz-feedback');
    const noQuizMsg = document.getElementById('no-quiz-msg');
    const actionButtons = document.getElementById('action-buttons');
    const watchHint = document.getElementById('watch-hint');

    let questions = [];
    let selectedAnswers = [];
    const videoId = parseInt("{{ video.id|default:'0' }}");

    if (videoEl) {
      videoEl.addEventListener('ended', () => {
        watchHint.style.display = 'none';
        fetch(`/api/questions/${videoId}/`)
          .then(r => r.json())
          .then(data => {
            questions = data;
            if (questions.length === 0) {
              noQuizMsg.style.display = 'block';
              return;
            }
            showAllQuestions();
          })
          .catch(() => {
            noQuizMsg.textContent = "⚠️ Failed to load quiz questions.";
            noQuizMsg.style.display = 'block';
          });
      });
    }

    function showAllQuestions() {
      quizBox.style.display = 'block';
      quizForm.innerHTML = '';
      feedback.className = '';
      feedback.style.display = 'none';

      questions.forEach((question, index) => {
        const block = document.createElement('div');
        block.className = 'question-block';

        const qText = document.createElement('p');
        qText.className = 'q-text';
        qText.textContent = `${index + 1}. ${question.text}`;
        block.appendChild(qText);

        question.options.forEach(opt => {
          const lbl = document.createElement('label');
          lbl.className = 'option-label';
          lbl.innerHTML = `<input type="radio" name="q_${question.id}" value="${opt.id}" required><span>${opt.text}</span>`;
          block.appendChild(lbl);
        });

        quizForm.appendChild(block);
      });

      const submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = '✅ Submit Answers';
      quizForm.appendChild(submitBtn);

      quizForm.onsubmit = e => {
        e.preventDefault();
        selectedAnswers = [];
        let incomplete = false;
        questions.forEach(q => {
          const sel = document.querySelector(`input[name="q_${q.id}"]:checked`);
          if (!sel) { incomplete = true; }
          else { selectedAnswers.push({ question_id: q.id, selected_option_id: parseInt(sel.value) }); }
        });
        if (incomplete) {
          feedback.textContent = "⚠️ Please answer all questions before submitting.";
          feedback.className = 'feedback-warn';
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';
        submitFinalScore(submitBtn);
      };
    }

    function submitFinalScore(btn) {
      fetch("{% url 'video_app:submit_quiz_result' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
        body: JSON.stringify({ video_id: videoId, answers: selectedAnswers })
      })
        .then(r => r.json())
        .then(data => {
          feedback.textContent = "🎉 Quiz submitted successfully!";
          feedback.className = 'feedback-ok';
          actionButtons.innerHTML = '';
          {% if is_last_video %}
          const a = document.createElement('a');
          a.href = "{% url 'video_app:video_list' %}";
          a.className = 'action-btn green';
          a.innerHTML = '✅ Finish & View Results';
          actionButtons.appendChild(a);
          {% else %}
          const a = document.createElement('a');
          a.href = "{% url 'video_app:video_list' %}";
          a.className = 'action-btn blue';
          a.innerHTML = '➡️ Next Video';
          actionButtons.appendChild(a);
          {% endif %}
        })
        .catch(() => {
          feedback.textContent = "❌ Failed to submit. Please try again.";
          feedback.className = 'feedback-warn';
          if (btn) { btn.disabled = false; btn.textContent = '✅ Submit Answers'; }
        });
    }
  </script>
</body>

</html>
