{% extends "base.html" %}
{% block body %}
{% block student_body %}
<!-- Navbar -->
<nav style="background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;height:60px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(79,70,229,.3);">
    <a href="{% url 'video_app:student_dashboard' %}"
        style="font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.5px;">
        🎓 QuizPortal
    </a>
    <div style="display:flex;align-items:center;gap:20px;">
        <a href="{% url 'video_app:student_dashboard' %}"
            style="color:rgba(255,255,255,.85);font-size:14px;font-weight:500;">Dashboard</a>
        <form method="post" action="{% url 'users:logout' %}" style="display:inline;">{% csrf_token %}
            <button type="submit" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
        color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;">Logout</button>
        </form>
    </div>
</nav>
<div style="padding:28px;max-width:1100px;margin:0 auto;">
    {% if messages %}
    <div class="messages" style="margin-bottom:20px;">
        {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}error{% else %}{{ msg.tags }}{% endif %}">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% block student_content %}{% endblock %}
</div>
{% endblock %}
{% endblock %}
