<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Django App{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-xl font-bold text-blue-600">🎓 EduVideoQuiz</h1>
    <div>
      {% if user.is_authenticated %}
        <a href="{% url 'video_app:certificate_list' %}" class="text-sm bg-green-500 hover:bg-green-600 text-white px-4 py-1 rounded mr-2 transition">🎓 My Certificates</a>
        <a href="{% url 'video_app:video_list' %}" class="text-sm bg-green-500 hover:bg-green-600 text-white px-4 py-1 rounded mr-2 transition">📽️ Videos</a>

        <form action="{% url 'users:logout' %}" method="post" class="inline">
          {% csrf_token %}
          <button class="text-sm bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded transition">Logout 👋🏻</button>
      </form>

      {% else %}
        <a href="{% url 'users:user_register' %}" class="text-blue-600 hover:underline mx-2">🤵🏼 Sign Up</a>
        <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline mx-2">👤 Login</a>
      {% endif %}
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto py-10 px-4">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
